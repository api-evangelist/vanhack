aid: vanhack
name: VanHack
description: VanHack is a SaaS hiring platform that connects employers with pre-screened
  senior software engineers from a global community of over 500,000 vetted candidates
  who are ready to relocate or work remotely. The platform pairs expert human recruiters
  with Vanna, an AI recruiter that matches candidates from natural-language job descriptions,
  and coordinates interviews with calendar sync, Slack, and ATS integration. VanHack
  reports 2,300+ hires at 520+ companies and charges a flat monthly fee with no placement
  fees. The company publishes no public developer API.
